
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 15px;
        }

        input, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            margin: 5px;
        }

        input {
            width: 220px;
            max-width: 70%;
        }

        button {
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #wynik {
            margin: 30px auto;
            max-width: 800px;
        }

        #obrazek {
            display: none;
            max-width: 100%;
            max-height: 500px;
            margin: 15px auto;
            border-radius: 8px;
        }

        #napis {
            font-size: 22px;
            margin-top: 20px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <h1>Witam!</h1>

    <p>Wpisz słowo:</p>

    <input type="text" id="haslo" placeholder="Wpisz słowo...">
    <button onclick="sprawdzHaslo()">Sprawdź</button>

    <div id="wynik">
        <img id="obrazek" src="" alt="Odkryty obrazek">
        <p id="napis"></p>
    </div>

    <script>
        // Słowa kluczowe, obrazki i napisy
        const odpowiedzi = {
            "start": {
                obraz: "start.png",
                tekst: "  "
            },

            "tajemnica": {
                obraz: "tajemnica.jpg",
                tekst: "Szukaj dalej..."
            },

            "zwyciestwo": {
                obraz: "wygrana.jpg",
                tekst: "Flaszka i kieliszek, kto da więcej?"
            },
            "browar": {
                obraz: "browar.jpg",
                tekst: "Flaszka i kieliszek, kto da więcej?"
            },
            
             "mcxvi": {
                tekst: "Świetnie Wam idzie, macie pierwszy kod. pora na BROWARA"
            },
             "flaszka": {
                tekst: "Flaszka - pije się mnie - długo"
            },
             "kieliszek": {
                tekst: "kieliszek - pije się mnie krótko."
            },
            
            "Łatwo": {
                tekst: "Szukajcie latarni, tej o której mówił Bob"
            },
            
            "mors": {
                obraz: "kod.jpg"
            }, 
            
            szeryf: {
                obraz: "jak.jpg"
            },
            
            "lampa jak chuj": {
                tekst: "Szukajcie mnie przy tablicy ogłoszeń"
            },
                
            "finał": {
                tekst: "Udowodnijcie, że jesteście godni finału rozwiązując ostatnią zagadkę!",
                obraz: "finał.png"
            },
        
            "154238": {
                tekst: "Jesteście godni finałowego starcia."
            },
        
            "pistolet": {
                tekst: "Otrzymujecie dwa dodatkowe strzały w finale."
            },
            
            "gra":{
                tekst: "do finałego kodu dodajcie sumę dwóch pozostałych, aby zyskać przewagę w ostatecznym starciu"
            },

            "161108":{
                tekst: "Kod na osłabienie poprawny. Jefrey traci jedno życie"
            },

            "Jefrey":{
                obraz: "Jef.jpg"
            },
            
        };

        function sprawdzHaslo() {
            const haslo = document.getElementById("haslo")
                .value.trim().toLowerCase();

            const obrazek = document.getElementById("obrazek");
            const napis = document.getElementById("napis");

            if (odpowiedzi[haslo]) {
                const wynik = odpowiedzi[haslo];

                napis.textContent = wynik.tekst;

                if (wynik.obraz) {
                    obrazek.onerror = function() {
                        obrazek.style.display = "none";
                    };

                    obrazek.onload = function() {
                        obrazek.style.display = "block";
                    };

                    obrazek.style.display = "none";
                    obrazek.src = wynik.obraz;
                } else {
                    obrazek.style.display = "none";
                    obrazek.removeAttribute("src");
                }

            } else {
                // Nieznane słowo: sam napis, bez obrazka
                obrazek.style.display = "none";
                obrazek.removeAttribute("src");

                napis.textContent =
                    "Spróbuj innego słowa.";
            }
        }

        document.getElementById("haslo").addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    sprawdzHaslo();
                }
            }
        );
    </script>

</body>
</html>
